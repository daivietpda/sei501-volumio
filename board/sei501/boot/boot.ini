SEI501-UBOOT-CONFIG

setenv board "sei501"
setenv dtb_loadaddr "0x10000000"
setenv dtbo_addr_r "0x11000000"
setenv loadaddr "0x01080000"
setenv initrd_loadaddr "0x13000000"
setenv maxcpus "4"

load mmc ${devno}:1 ${loadaddr} config.ini && ini generic ${loadaddr}
load mmc ${devno}:1 ${loadaddr} user.config.ini && ini user ${loadaddr}

setenv consoleargs "console=ttyAML0,115200n8"
setenv bootargs "${verbosity} ${volumioargs} ${condev} no_console_suspend net.ifnames=0 elevator=noop maxcpus=${maxcpus} consoleblank=0 hwdevice=${board}"

fatload mmc ${devno}:1 ${loadaddr} Image
fatload mmc ${devno}:1 ${initrd_loadaddr} uInitrd
fatload mmc ${devno}:1 ${dtb_loadaddr} amlogic/meson-g12a-sei501.dtb
fdt addr ${dtb_loadaddr}

echo "Booting SEI501 Volumio kernel ..."
booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}
