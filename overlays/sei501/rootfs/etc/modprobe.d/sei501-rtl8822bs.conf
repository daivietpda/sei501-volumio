# SEI501 RTL8822BS: vendor driver is reliable on the G12A dedicated SDIO host.
blacklist rtw88_8822bs
blacklist rtw88_sdio
blacklist rtw88_8822b
blacklist rtw88_core
# Keep the radio and SDIO device out of the vendor driver hardware power-down path.
# The SEI501 module otherwise reports SurpriseRemoved after idle time.
options 8822bs rtw_ips_mode=0 rtw_lps_level=0 rtw_power_mgnt=0 rtw_low_power=0 rtw_hwpdn_mode=0 rtw_check_hw_status=1 rtw_smart_ps=0 rtw_wmm_smart_ps=0 rtw_btcoex_enable=2 rtw_ampdu_enable=0 rtw_dynamic_agg_enable=0 rtw_rx_ampdu_amsdu=0 rtw_tx_ampdu_amsdu=0